openapi: 3.1.0
info: {title: tt_cup_api API, description: tt_cup_api API, version: 1.0.0}
servers:
- {url: 'https://api.ttcup.dev.mhdonline.cz'}
paths:
  /:
    get:
      description: ''
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema: {type: string}
              examples:
                Example#1: {value: ''}
      operationId: getHello
  /capture:
    post:
      description: ''
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CaptureDto'}
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema: {type: object}
      operationId: capturePage
  /crawl:
    get:
      description: ''
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/PaginatedQueryResult_CrawlPage'}
      operationId: getPagesToCrawl
    post:
      description: ''
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GetPagesToCrawlRequest'}
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/PaginatedQueryResult_CrawlPage'}
  /match:
    post:
      description: ''
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GetMatchesRequest'}
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/PaginatedQueryResult_Match'}
      operationId: getMatches
  /openapi.yaml:
    get:
      description: ''
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {type: string}
        '500':
          description: Internal Server Error
          content:
            text/plain:
              schema: {type: string}
              examples:
                Example#1: {value: ''}
                Example#2: {value: ''}
      operationId: getOpenapi
  /player:
    post:
      description: ''
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GetPlayersRequest'}
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/PaginatedQueryResult_Player'}
      operationId: getPlayers
  /player/{playerUid}:
    get:
      description: ''
      parameters:
      - name: playerUid
        in: path
        required: true
        schema: {type: string}
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema: {type: string}
        '404':
          description: Not Found
          content:
            '*/*':
              schema: {type: object}
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/Player'}
      operationId: getPlayer
  /player/{playerUid}/favourite:
    patch:
      description: ''
      parameters:
      - name: playerUid
        in: path
        required: true
        schema: {type: string}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Status'}
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema: {type: string}
        '404':
          description: Not Found
          content:
            '*/*':
              schema: {type: object}
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/Status'}
      operationId: setPlayerFavourite
  /player/{playerUid}/rivals:
    get:
      description: ''
      parameters:
      - name: playerUid
        in: path
        required: true
        schema: {type: string}
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema: {type: string}
        '404':
          description: Not Found
          content:
            '*/*':
              schema: {type: object}
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items: {$ref: '#/components/schemas/RivalMatchesSummary'}
      operationId: getPlayerRivals
  /player/{playerUid}/summary:
    get:
      description: ''
      parameters:
      - name: playerUid
        in: path
        required: true
        schema: {type: string}
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema: {type: string}
        '404':
          description: Not Found
          content:
            '*/*':
              schema: {type: object}
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/MatchesSummary'}
      operationId: getPlayerMatchesSummary
  /player/new:
    post:
      description: ''
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewPlayer'}
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema: {type: string}
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/Status'}
      operationId: newPlayer
  /tournament:
    post:
      description: ''
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GetTournamentsRequest'}
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/PaginatedQueryResult_Tournament'}
      operationId: getTournaments
  /tournament/{tournamentId}:
    get:
      description: ''
      parameters:
      - name: tournamentId
        in: path
        required: true
        schema: {type: string}
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema: {type: string}
        '404':
          description: Not Found
          content:
            '*/*':
              schema: {type: object}
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/Tournament'}
      operationId: getTournament
  /tournament/{tournamentId}/full:
    get:
      description: ''
      parameters:
      - name: tournamentId
        in: path
        required: true
        schema: {type: string}
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema: {type: string}
        '404':
          description: Not Found
          content:
            '*/*':
              schema: {type: object}
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/TournamentFull'}
      operationId: getTournamentFull
  /user:
    get:
      description: ''
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/User'}
        '500':
          description: Internal Server Error
          content:
            text/plain:
              schema: {type: string}
              examples:
                Example#1: {value: ''}
      operationId: getUser
  /{...}:
    get:
      description: ''
      parameters:
      - name: '...'
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema: {type: string}
              examples:
                Example#1: {value: ''}
components:
  schemas:
    CaptureDto:
      type: object
      properties:
        url: {type: string}
        html: {type: string}
      required: [url, html]
    CrawlPage:
      type: object
      properties:
        url: {type: string}
      required: [url]
    PageInfo:
      type: object
      properties:
        page: {type: integer, format: int32}
        size: {type: integer, format: int32, default: '20'}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer, format: int32}
        sort:
          type: array
          nullable: true
          items: {type: string}
      required: [page, size, totalElements, totalPages]
    PaginatedQueryResult:
      type: object
      properties:
        results: {type: array}
        pageInfo: {$ref: '#/components/schemas/PageInfo'}
      required: [results, pageInfo]
    PaginatedQueryResult_CrawlPage:
      type: object
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/CrawlPage'}
        pageInfo: {$ref: '#/components/schemas/PageInfo'}
      required: [results, pageInfo]
    PageInfoRequest:
      type: object
      properties:
        page: {type: integer, format: int32}
        size: {type: integer, format: int32, default: '20'}
        sort:
          type: array
          nullable: true
          items: {type: string}
      required: [page, size]
    GetPagesToCrawlRequest:
      type: object
      properties:
        pageInfo: {$ref: '#/components/schemas/PageInfoRequest'}
      required: [pageInfo]
    GetMatchesRequest:
      type: object
      properties:
        playerUids:
          type: array
          nullable: true
          items: {type: string}
        pageInfo: {$ref: '#/components/schemas/PageInfoRequest'}
      required: [pageInfo]
    ObjectId: {type: string}
    Match:
      type: object
      properties:
        time: {type: string, format: date-time}
        playerUids:
          type: array
          items: {type: string}
          prefixItems:
          - {type: string}
          - {type: string}
        sets:
          type: array
          nullable: true
          items: {type: integer, format: int32}
          prefixItems:
          - {type: integer, format: int32}
          - {type: integer, format: int32}
        points:
          type: array
          nullable: true
          items: {type: string}
        tournamentId: {nullable: true, $ref: '#/components/schemas/ObjectId'}
        _id: {nullable: true, $ref: '#/components/schemas/ObjectId'}
      required: [time, playerUids]
    PaginatedQueryResult_Match:
      type: object
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/Match'}
        pageInfo: {$ref: '#/components/schemas/PageInfo'}
      required: [results, pageInfo]
    GetPlayersRequest:
      type: object
      properties:
        search: {type: string, nullable: true}
        location: {$ref: '#/components/schemas/Location'}
        pageInfo: {$ref: '#/components/schemas/PageInfoRequest'}
      required: [pageInfo]
    Player:
      type: object
      properties:
        uid: {type: string}
        name: {type: string, nullable: true}
        elo: {type: integer, format: int32, nullable: true}
        recrawl: {type: boolean, nullable: true}
        favourite: {type: boolean, nullable: true}
        location: {$ref: '#/components/schemas/Location'}
      required: [uid]
    PaginatedQueryResult_Player:
      type: object
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/Player'}
        pageInfo: {$ref: '#/components/schemas/PageInfo'}
      required: [results, pageInfo]
    Status:
      type: object
      properties:
        status: {type: boolean}
      required: [status]
    RivalMatchesSummary:
      type: object
      properties:
        rivalUid: {type: string}
        matchesWon: {type: integer, format: int32}
        matchesLost: {type: integer, format: int32}
        longestWinStreak: {type: integer, format: int32}
        longestLoseStreak: {type: integer, format: int32}
        currentWinStreak: {type: integer, format: int32}
        currentLoseStreak: {type: integer, format: int32}
      required: [rivalUid, matchesWon, matchesLost, longestWinStreak, longestLoseStreak,
        currentWinStreak, currentLoseStreak]
    MatchesSummary:
      type: object
      properties:
        matchesWon: {type: integer, format: int32}
        matchesLost: {type: integer, format: int32}
        longestWinStreak: {type: integer, format: int32}
        longestLoseStreak: {type: integer, format: int32}
        currentWinStreak: {type: integer, format: int32}
        currentLoseStreak: {type: integer, format: int32}
      required: [matchesWon, matchesLost, longestWinStreak, longestLoseStreak, currentWinStreak,
        currentLoseStreak]
    NewPlayer:
      type: object
      properties:
        uid: {type: string}
        location: {$ref: '#/components/schemas/Location'}
      required: [uid]
    GetTournamentsRequest:
      type: object
      properties:
        pageInfo: {$ref: '#/components/schemas/PageInfoRequest'}
      required: [pageInfo]
    Tournament:
      type: object
      properties:
        date: {type: string, format: date}
        place: {type: string}
        _id: {nullable: true, $ref: '#/components/schemas/ObjectId'}
      required: [date, place]
    PaginatedQueryResult_Tournament:
      type: object
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/Tournament'}
        pageInfo: {$ref: '#/components/schemas/PageInfo'}
      required: [results, pageInfo]
    TournamentFull:
      type: object
      properties:
        date: {type: string, format: date}
        place: {type: string}
        matches:
          type: array
          items: {$ref: '#/components/schemas/Match'}
        _id: {$ref: '#/components/schemas/ObjectId'}
      required: [date, place, matches, _id]
    User:
      type: object
      properties:
        uid: {type: string}
      required: [uid]
    Location:
      type: string
      enum: [B, P, H]
      x-enumNames: [HAVLICKUV_BROD, PRAHA, HAVIROV]
