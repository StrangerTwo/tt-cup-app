        content:
          application/json:
            schema: {$ref: '#/components/schemas/GetBetsRequest'}
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/PaginatedQueryResult_BetFull'}
      operationId: getBets
  /bet/{matchId}:
    get:
      description: ''
