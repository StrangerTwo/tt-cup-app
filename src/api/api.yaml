      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditPlace'}
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema: {type: string}
        '404':
          description: Not Found
          content:
            '*/*':
              schema: {type: object}
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/Status'}
      operationId: editPlace
  /place/{placeUid}/enabled:
    patch:
      description: ''
      parameters:
      - name: placeUid
        in: path
        required: true
        schema: {type: string}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Status'}
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema: {type: string}
        '404':
          description: Not Found
          content:
            '*/*':
              schema: {type: object}
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/Status'}
      operationId: setPlaceEnabled
  /place/outdated:
    get:
      description: ''
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items: {$ref: '#/components/schemas/OutdatedPlace'}
      operationId: getOutdatedPlaces
  /player:
    post:
      description: ''
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GetPlayersRequest'}
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/PaginatedQueryResult_PlayerSummary'}
      operationId: getPlayers
  /player/{playerUid}:
    get:
      description: ''
      parameters:
      - name: playerUid
        in: path
        required: true
        schema: {type: string}
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema: {type: string}
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/Player'}
        '404':
          description: Not Found
          content:
            '*/*':
              schema: {type: object}
      operationId: getPlayer
    patch:
      description: ''
      parameters:
      - name: playerUid
        in: path
        required: true
        schema: {type: string}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditPlayer'}
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema: {type: string}
        '404':
          description: Not Found
          content:
            '*/*':
              schema: {type: object}
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/Status'}
      operationId: editPlayer
  /player/{playerUid}/favourite:
    patch:
      description: ''
      parameters:
      - name: playerUid
        in: path
        required: true
        schema: {type: string}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Status'}
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema: {type: string}
        '404':
          description: Not Found
          content:
            '*/*':
              schema: {type: object}
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/Status'}
      operationId: setPlayerFavourite
  /player/{playerUid}/rival:
    post:
      description: ''
      parameters:
      - name: playerUid
        in: path
        required: true
        schema: {type: string}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GetPlayerRivalsRequest'}
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema: {type: string}
        '404':
          description: Not Found
          content:
            '*/*':
              schema: {type: object}
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/PaginatedQueryResult_RivalMatchesSummary'}
      operationId: getPlayerRivals
  /player/{playerUid}/rival/{rivalUid}:
    get:
      description: ''
      parameters:
      - name: playerUid
        in: path
        required: true
        schema: {type: string}
      - name: rivalUid
        in: path
        required: true
        schema: {type: string}
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema: {type: string}
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/Summary'}
        '404':
          description: Not Found
          content:
            '*/*':
              schema: {type: object}
      operationId: getSummaryForRivalry
  /player/{playerUid}/summary:
    get:
      description: ''
      parameters:
      - name: playerUid
        in: path
        required: true
        schema: {type: string}
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema: {type: string}
        '404':
          description: Not Found
          content:
            '*/*':
              schema: {type: object}
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/Summary'}
      operationId: getSummaryForPlayer
  /player/new:
    post:
      description: ''
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewPlayer'}
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema: {type: string}
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/ObjectId'}
        '500':
          description: Internal Server Error
          content:
            text/plain:
              schema: {type: string}
              examples:
                Example#1: {value: ''}
      operationId: newPlayer
  /tournament:
    get:
      description: ''
      parameters:
      - name: place
        in: query
        required: false
        schema: {type: string}
      - name: date
        in: query
        required: false
        schema: {type: string}
      - name: players
        in: query
        required: false
        schema: {type: boolean}
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema: {type: string}
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/TournamentFull'}
        '404':
          description: Not Found
          content:
            '*/*':
              schema: {type: object}
      operationId: getQueryTournament
    post:
      description: ''
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GetTournamentsRequest'}
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/Tournaments'}
      operationId: getTournaments
  /tournament/{tournamentId}:
    get:
      description: ''
      parameters:
      - name: players
        in: query
        required: false
        schema: {type: boolean}
      - name: tournamentId
        in: path
        required: true
        schema: {type: string}
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema: {type: string}
        '404':
          description: Not Found
          content:
            '*/*':
              schema: {type: object}
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/TournamentFull'}
      operationId: getTournament
  /tournament/today:
    post:
      description: ''
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GetTournamentsTodayRequest'}
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/TournamentsToday'}
      operationId: getTournamentsToday
  /user:
    get:
      description: ''
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/User'}
        '500':
          description: Internal Server Error
          content:
            text/plain:
              schema: {type: string}
              examples:
                Example#1: {value: ''}
      operationId: getUser
  /{...}:
    get:
      description: ''
      parameters:
      - name: '...'
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema: {type: string}
              examples:
                Example#1: {value: ''}
components:
  schemas:
    BetSummary:
      type: object
      properties:
        betsWon: {type: integer, format: int32}
        betsLost: {type: integer, format: int32}
        betsUnresolved: {type: integer, format: int32}
      required: [betsWon, betsLost, betsUnresolved]
    PageInfoRequest:
      type: object
      properties:
        page: {type: integer, format: int32}
        size: {type: integer, format: int32, default: '20'}
        sort:
          type: array
          items: {type: string}
      required: [page, size]
    GetBetsRequest:
      type: object
      properties:
        location: {$ref: '#/components/schemas/Location'}
        tournamentId: {type: string}
        matchId: {type: string}
        playerUids:
          type: array
          items: {type: string}
        type: {$ref: '#/components/schemas/BetType'}
        win: {type: boolean}
        resolved: {type: boolean}
        pageInfo: {$ref: '#/components/schemas/PageInfoRequest'}
      required: [pageInfo]
    ObjectId: {type: string}
    Bet:
      type: object
      properties:
        location: {$ref: '#/components/schemas/Location'}
        tournamentId: {$ref: '#/components/schemas/ObjectId'}
        matchId: {$ref: '#/components/schemas/ObjectId'}
        playerUids:
          type: array
          items: {type: string}
        type: {$ref: '#/components/schemas/BetType'}
        win: {type: boolean}
        _id: {$ref: '#/components/schemas/ObjectId'}
      required: [tournamentId, matchId, playerUids, type, _id, _id]
    Match:
      type: object
      properties:
        time: {type: string, format: date-time}
        playerUids:
          type: array
          items: {type: string}
          prefixItems:
          - {type: string}
          - {type: string}
        sets:
          type: array
          items: {type: integer, format: int32}
          prefixItems:
          - {type: integer, format: int32}
          - {type: integer, format: int32}
        points:
          type: array
          items: {type: string}
        tournamentId: {$ref: '#/components/schemas/ObjectId'}
        _id: {$ref: '#/components/schemas/ObjectId'}
      required: [time, playerUids, tournamentId, _id, _id]
    BetFull:
      type: object
      properties:
        bet: {$ref: '#/components/schemas/Bet'}
        match: {$ref: '#/components/schemas/Match'}
      required: [bet, match]
    PageInfo:
      type: object
      properties:
        page: {type: integer, format: int32}
        size: {type: integer, format: int32, default: '20'}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer, format: int32}
        sort:
          type: array
          items: {type: string}
      required: [page, size, totalElements, totalPages]
    PaginatedQueryResult:
      type: object
      properties:
        results: {type: array}
        pageInfo: {$ref: '#/components/schemas/PageInfo'}
      required: [results, pageInfo]
    PaginatedQueryResult_BetFull:
      type: object
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/BetFull'}
        pageInfo: {$ref: '#/components/schemas/PageInfo'}
      required: [results, pageInfo]
    NewBet:
      type: object
      properties:
        type: {$ref: '#/components/schemas/BetType'}
      required: [type]
    CaptureDto:
      type: object
      properties:
        url: {type: string}
        html: {type: string}
      required: [url, html]
    CrawlPage:
      type: object
      properties:
        url: {type: string}
      required: [url]
    PaginatedQueryResult_CrawlPage:
      type: object
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/CrawlPage'}
        pageInfo: {$ref: '#/components/schemas/PageInfo'}
      required: [results, pageInfo]
    GetPagesToCrawlRequest:
      type: object
      properties:
        pageInfo: {$ref: '#/components/schemas/PageInfoRequest'}
      required: [pageInfo]
    Status:
      type: object
      properties:
        status: {type: boolean}
      required: [status]
    GetMatchesRequest:
      type: object
      properties:
        playerUids:
          type: array
          items: {type: string}
        pageInfo: {$ref: '#/components/schemas/PageInfoRequest'}
      required: [pageInfo]
    PaginatedQueryResult_Match:
      type: object
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/Match'}
        pageInfo: {$ref: '#/components/schemas/PageInfo'}
      required: [results, pageInfo]
    GetPlacesRequest:
      type: object
      properties:
        search: {type: string}
        location: {$ref: '#/components/schemas/Location'}
        pageInfo: {$ref: '#/components/schemas/PageInfoRequest'}
      required: [pageInfo]
    Place:
      type: object
      properties:
        uid: {type: string}
        name: {type: string}
        startTime: {type: string, format: partial-time}
        location: {$ref: '#/components/schemas/Location'}
        lastUpdate: {type: string, format: date-time}
        enabled: {type: boolean}
      required: [uid, name, startTime]
    PaginatedQueryResult_Place:
      type: object
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/Place'}
        pageInfo: {$ref: '#/components/schemas/PageInfo'}
      required: [results, pageInfo]
    EditPlace:
      type: object
      properties:
        location: {$ref: '#/components/schemas/Location'}
    OutdatedPlace:
      type: object
      properties:
        place: {$ref: '#/components/schemas/Place'}
        updateUrl: {type: string}
      required: [place, updateUrl]
    GetPlayersRequest:
      type: object
      properties:
        search: {type: string}
        location: {$ref: '#/components/schemas/Location'}
        uids:
          type: array
          items: {type: string}
        pageInfo: {$ref: '#/components/schemas/PageInfoRequest'}
      required: [pageInfo]
    Player:
      type: object
      properties:
        uid: {type: string}
        name: {type: string}
        ranking: {type: integer, format: int32}
        elo: {type: integer, format: int32}
        favourite: {type: boolean}
        location: {$ref: '#/components/schemas/Location'}
        note: {type: string}
        stisId: {type: string}
        recrawl: {type: boolean}
      required: [uid]
    Summary:
      type: object
      properties:
        playerUid: {type: string}
        rivalUid: {type: string}
        matchesWon: {type: integer, format: int32}
        matchesLost: {type: integer, format: int32}
        longestWinStreak: {type: integer, format: int32}
        longestLoseStreak: {type: integer, format: int32}
        currentWinStreak: {type: integer, format: int32}
        currentLoseStreak: {type: integer, format: int32}
        winRate: {type: number, format: double}
      required: [playerUid, matchesWon, matchesLost, longestWinStreak, longestLoseStreak,
        currentWinStreak, currentLoseStreak]
    PlayerSummary:
      type: object
      properties:
        player: {$ref: '#/components/schemas/Player'}
        summary: {$ref: '#/components/schemas/Summary'}
      required: [player, summary]
    PaginatedQueryResult_PlayerSummary:
      type: object
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/PlayerSummary'}
        pageInfo: {$ref: '#/components/schemas/PageInfo'}
      required: [results, pageInfo]
    EditPlayer:
      type: object
      properties:
        location: {$ref: '#/components/schemas/Location'}
        note: {type: string}
        stisId: {type: string}
    GetPlayerRivalsRequest:
      type: object
      properties:
        search: {type: string}
        location: {$ref: '#/components/schemas/Location'}
        pageInfo: {$ref: '#/components/schemas/PageInfoRequest'}
      required: [pageInfo]
    MatchesSummary:
      type: object
      properties:
        matchesWon: {type: integer, format: int32}
        matchesLost: {type: integer, format: int32}
        longestWinStreak: {type: integer, format: int32}
        longestLoseStreak: {type: integer, format: int32}
        currentWinStreak: {type: integer, format: int32}
        currentLoseStreak: {type: integer, format: int32}
      required: [matchesWon, matchesLost, longestWinStreak, longestLoseStreak, currentWinStreak,
        currentLoseStreak]
    RivalMatchesSummary:
      type: object
      properties:
        rivalUid: {type: string}
        rival: {$ref: '#/components/schemas/Player'}
        matchesSummary: {$ref: '#/components/schemas/MatchesSummary'}
      required: [rivalUid, matchesSummary]
    PaginatedQueryResult_RivalMatchesSummary:
      type: object
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/RivalMatchesSummary'}
        pageInfo: {$ref: '#/components/schemas/PageInfo'}
      required: [results, pageInfo]
    NewPlayer:
      type: object
      properties:
        uid: {type: string}
        location: {$ref: '#/components/schemas/Location'}
      required: [uid]
    Tournament:
      type: object
      properties:
        date: {type: string, format: date}
        place: {type: string}
        done: {type: boolean}
        _id: {$ref: '#/components/schemas/ObjectId'}
      required: [date, place, _id, _id]
    TournamentFull:
      type: object
      properties:
        place: {$ref: '#/components/schemas/Place'}
        tournament: {$ref: '#/components/schemas/Tournament'}
        matches:
          type: array
          items: {$ref: '#/components/schemas/Match'}
        bets:
          type: array
          items: {$ref: '#/components/schemas/Bet'}
        players:
          type: array
          items: {$ref: '#/components/schemas/Player'}
      required: [place, tournament, matches, bets]
    GetTournamentsRequest:
      type: object
      properties:
