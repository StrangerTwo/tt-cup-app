      operationId: getMatches
  /openapi.yaml:
    get:
      description: ''
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {type: string}
        '500':
          description: Internal Server Error
          content:
            text/plain:
              schema: {type: string}
              examples:
                Example#1: {value: ''}
      operationId: getOpenapi
  /place:
    post:
      description: ''
