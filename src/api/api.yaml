openapi: 3.1.0
info: {title: tt_cup_api API, description: tt_cup_api API, version: 1.0.0}
servers:
- {url: 'https://api.ttcup.dev.mhdonline.cz'}
paths:
  /:
    get:
      description: ''
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema: {type: string}
              examples:
                Example#1: {value: ''}
      operationId: getHello
  /bet:
    get:
      description: ''
      parameters:
      - name: location
        in: query
        required: false
        schema: {type: string}
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema: {type: string}
        '200':
          description: OK
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/BetSummary'}
      operationId: getBetsSummary
    post:
      description: ''
